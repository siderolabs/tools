name: tools-osslsigncode
variant: scratch
dependencies:
  - stage: base
  - stage: tools-openssl
    runtime: true
  - stage: tools-zlib-ng
    runtime: true
  - stage: cmake
  - stage: pkgconf
steps:
  - sources:
      - url: https://github.com/mtrojnar/osslsigncode/archive/refs/tags/{{ .osslsigncode_version }}.tar.gz
        destination: osslsigncode.tar.gz
        sha256: "{{ .osslsigncode_sha256 }}"
        sha512: "{{ .osslsigncode_sha512 }}"
    prepare:
      - |
        tar -xzf osslsigncode.tar.gz --strip-components=1

        cmake -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr
    build:
      - |
        cmake --build build -j $(nproc)
    install:
      - |
        DESTDIR=/rootfs cmake --install build
finalize:
  - from: /rootfs
    to: /
