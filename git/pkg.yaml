name: git
variant: scratch
dependencies:
  - stage: base
  - stage: tools-zlib-ng
    runtime: true
  - stage: gettext
  - stage: tools-openssl
  - stage: curl
    runtime: true
  - stage: autoconf
steps:
  - sources:
      - url: https://mirrors.edge.kernel.org/pub/software/scm/git/git-{{ .git_version }}.tar.xz
        destination: git.tar.xz
        sha256: "{{ .git_sha256 }}"
        sha512: "{{ .git_sha512 }}"
    prepare:
      - |
        tar -xJf git.tar.xz --strip-components=1
        make configure
        ./configure --prefix=/usr
    build:
      - |
        # NO_RUST=1: opt out of git's optional Rust subsystem (needs cargo, not
        # in the toolchain). Git 3.0 will make Rust mandatory - revisit then.
        make -j $(nproc) NO_RUST=1
    install:
      - |
        make DESTDIR=/rootfs NO_RUST=1 install
finalize:
  - from: /rootfs
    to: /
